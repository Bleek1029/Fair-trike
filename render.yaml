services:
  - type: web
    name: fairtrike
    runtime: node
    plan: free
    buildCommand: npm install --no-fund --no-audit && npm --prefix backend install --no-fund --no-audit && NODE_ENV=development npm --prefix frontend install --no-fund --no-audit && NODE_ENV=development npm --prefix frontend run build
    startCommand: node scripts/start.mjs --skip-frontend-install
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SKIP_FRONTEND_INSTALL
        value: "true"

  # Optional: PostgreSQL database (uncomment and configure if needed)
  # - type: pserv
  #   name: fairtrike-db
  #   plan: free
  #   ipAllowList: []