# Render Blueprint for Fairtrike
# Free tier web service + external PostgreSQL (Neon/Supabase/Railway free tiers)
# Total cost: $0/mo (with cold starts on free web tier)

services:
  - type: web
    name: fairtrike
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/Bleek1029/Fair-trike
    branch: main
    rootDir: backend
    buildCommand: npm ci && npm run build --prefix ../frontend
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SINGLE_PORT
        value: "true"
      - key: DATABASE_URL
        sync: false
        # Set this to your external PostgreSQL connection string:
        # Neon: postgresql://user:pass@ep-xxx.us-east-1.aws.neon.tech/dbname?sslmode=require
        # Supabase: postgresql://postgres:pass@db.xxx.supabase.co:5432/postgres
        # Railway: postgresql://user:pass@containers-us-xxx.railway.app:5432/railway
      - key: JWT_SECRET
        generateValue: true
      - key: ORS_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
        # Set to your Render URL after deploy: https://fairtrike.onrender.com