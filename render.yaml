# Render Blueprint for Fairtrike
# Free tier web service + external PostgreSQL (Neon)
# Total cost: $0/mo (with cold starts on free web tier)

services:
  - type: web
    name: fairtrike
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/Bleek1029/Fair-trike
    branch: main
    rootDir: backend
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SINGLE_PORT
        value: "true"
      - key: DATABASE_URL
        sync: false
        # Neon pooled connection string (set in Render dashboard)
        # postgresql://neondb_owner:npg_rOQK8iUwR7dh@ep-gentle-credit-a1u8bndm-pooler.ap-southeast-1.aws.neon.tech/neondb?channel_binding=require&sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
        # Set to your frontend URL after deploy: https://fairtrike.onrender.com
      - key: ORS_API_KEY
        value: "731b617556a64c9d8ad12b66c648797d"
      - key: GEMINI_API_KEY
        sync: false
        # Google AI Studio API key (auth key format AQ.*) - add in Render Dashboard
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_FILE_SIZE_MB
        value: "5"
      - key: AUTH_RATE_WINDOW_MS
        value: "900000"
      - key: AUTH_RATE_MAX
        value: "100"