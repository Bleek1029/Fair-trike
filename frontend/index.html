<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="app-version" content="<%= version %>" />
    <title>Fairtrike Olongapo | Commuter Transit Portal</title>
    <meta name="description" content="Olongapo City tricycle transit hailing and regulated fare matrix." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#004328" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fairtrike" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3" />
    <!-- Boot-splash logo: fetched immediately so the mark paints before the bundle -->
    <link rel="preload" as="image" href="/fairtrike-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <style>
      /* Inline boot splash so the logo+name paint instantly on refresh, before the bundle loads */
      #boot-splash { position: fixed; inset: 0; z-index: 9999; display: flex; justify-content: center; align-items: center; overflow: hidden;
        background: radial-gradient(600px 300px at 50% 18%, rgba(13,92,58,.16), transparent 70%),
                    radial-gradient(500px 260px at 50% 85%, rgba(0,108,73,.10), transparent 70%), #faf8ff;
        transition: opacity .4s ease; }
      #boot-splash.boot-hidden { opacity: 0; pointer-events: none; }
      #boot-splash .brand-loader-inner { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 24px; }
      #boot-splash .brand-mark-wrap { position: relative; display: inline-flex; }
      #boot-splash .brand-wind { position: absolute; height: 4px; border-radius: 999px;
        background: linear-gradient(90deg, transparent, #0d5c3a);
        box-shadow: 0 0 10px rgba(13,92,58,.6); opacity: 0;
        animation: brandWind 2.2s ease-in-out infinite; }
      #boot-splash .brand-wind--1 { width: 58px; right: 74%; top: 28%; animation-delay: 0s; }
      #boot-splash .brand-wind--2 { width: 50px; right: 80%; top: 42%; animation-delay: .36s; }
      #boot-splash .brand-wind--3 { width: 66px; right: 76%; top: 56%; animation-delay: .73s; }
      #boot-splash .brand-wind--4 { width: 44px; right: 86%; top: 66%; animation-delay: 1.09s; }
      #boot-splash .brand-wind--5 { width: 54px; right: 82%; top: 20%; animation-delay: 1.46s; }
      #boot-splash .brand-wind--6 { width: 48px; right: 84%; top: 48%; animation-delay: 1.82s; }
      #boot-splash .brand-smoke { position: absolute; bottom: 5%; width: 22px; height: 22px; border-radius: 999px;
        background: radial-gradient(circle at 40% 40%, rgba(140,150,163,.92), rgba(185,193,201,.7) 55%, rgba(185,193,201,.2) 78%, transparent 100%);
        opacity: 0; animation: brandSmoke 1.5s ease-out infinite; }
      #boot-splash .brand-smoke--1 { left: 14%; animation-delay: 0s; }
      #boot-splash .brand-smoke--2 { left: 28%; animation-delay: .5s; }
      #boot-splash .brand-smoke--3 { left: 42%; animation-delay: 1s; }
      #boot-splash .brand-mark-logo { display: block; object-fit: contain; animation: brandDrive 2.2s ease-in-out forwards, brandBob 0.5s ease-in-out 2.2s infinite;
        filter: drop-shadow(0 14px 30px rgba(13,92,58,.22)); }
      #boot-splash .brand-loader-name { margin-top: 18px; font-size: 40px; font-weight: 800; letter-spacing: -.02em; color: #131b2e; font-family: 'Plus Jakarta Sans',sans-serif; }
      #boot-splash .brand-loader-letter { display: inline-block; animation: brandTextDrive 2.2s ease-in-out forwards; }
      #boot-splash .brand-loader-sub { margin-top: 4px; font-size: 11px; font-weight: 700; letter-spacing: .22em; color: #004328; font-family: 'Plus Jakarta Sans',sans-serif; animation: brandTextDrive 2.2s ease-in-out forwards; animation-delay: .45s; }
      #boot-splash .brand-loader-bar { margin-top: 20px; width: 210px; height: 6px; border-radius: 9999px; background: #dae2fd; overflow: hidden; }
      #boot-splash .brand-loader-bar-fill { height: 100%; width: 40%; border-radius: 9999px; background: #0d5c3a; animation: brandBarSlide 1.1s ease-in-out infinite; }
      #boot-splash .brand-loader-msg { margin-top: 12px; font-size: 13px; color: #006c49; font-family: 'Plus Jakarta Sans',sans-serif; animation: brandMsgPulse 1.4s ease-in-out infinite; }
      @keyframes brandWind {
        0%   { transform: translateX(40px) scaleX(.3); opacity: 0; }
        4%   { opacity: 1; }
        32%  { transform: translateX(-14px) scaleX(1.45); opacity: 1; }
        58%  { transform: translateX(-58px) scaleX(1.2); opacity: 1; }
        80%  { transform: translateX(-92px) scaleX(.85); opacity: 1; }
        88%  { transform: translateX(-102px) scaleX(.6); opacity: 0; }
        100% { transform: translateX(-106px) scaleX(.5); opacity: 0; }
      }
      @keyframes brandSmoke {
        0%   { transform: translate(0, 0) scale(.4); opacity: 0; }
        20%  { opacity: .95; }
        100% { transform: translate(-26px, -34px) scale(1.9); opacity: 0; }
      }
      @keyframes brandDrive {
        0%   { transform: translateX(-110px) translateY(0) scale(.9); opacity: 0; }
        12%  { opacity: 1; }
        45%  { transform: translateX(0) translateY(0) scale(1); }
        52%  { transform: translateX(4px) translateY(-4px) scale(1.02); }
        60%  { transform: translateX(0) translateY(0) scale(1); }
        72%  { transform: translateX(0) translateY(-3px) scale(1); }
        84%  { transform: translateX(0) translateY(0) scale(1); }
        100% { transform: translateX(0) translateY(0) scale(1); }
      }
      @keyframes brandBob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes brandTextDrive {
        0%   { transform: translateX(-70px) translateY(0) scale(.85); opacity: 0; }
        10%  { opacity: 1; }
        42%  { transform: translateX(0) translateY(0) scale(1); }
        52%  { transform: translateX(5px) translateY(-4px) scale(1.04); }
        62%  { transform: translateX(0) translateY(0) scale(1); }
        74%  { transform: translateX(0) translateY(-2px) scale(1); }
        86%  { transform: translateX(0) translateY(0) scale(1); }
        100% { transform: translateX(0) translateY(0) scale(1); }
      }
      @keyframes brandBarSlide { 0% { transform: translateX(-110%); } 100% { transform: translateX(280%); } }
      @keyframes brandMsgPulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="brand-loader-inner">
        <div class="brand-mark-wrap">
          <span class="brand-wind brand-wind--1"></span>
          <span class="brand-wind brand-wind--2"></span>
          <span class="brand-wind brand-wind--3"></span>
          <span class="brand-wind brand-wind--4"></span>
          <span class="brand-wind brand-wind--5"></span>
          <span class="brand-wind brand-wind--6"></span>
          <span class="brand-smoke brand-smoke--1"></span>
          <span class="brand-smoke brand-smoke--2"></span>
          <span class="brand-smoke brand-smoke--3"></span>
          <img class="brand-mark-logo" src="/fairtrike-logo.png" alt="Fairtrike logo" width="144" height="144" />
        </div>
        <div class="brand-loader-name">
          <span class="brand-loader-letter" style="animation-delay:0s">F</span><span class="brand-loader-letter" style="animation-delay:0.06s">a</span><span class="brand-loader-letter" style="animation-delay:0.12s">i</span><span class="brand-loader-letter" style="animation-delay:0.18s">r</span><span class="brand-loader-letter" style="animation-delay:0.24s">t</span><span class="brand-loader-letter" style="animation-delay:0.3s">r</span><span class="brand-loader-letter" style="animation-delay:0.36s">i</span><span class="brand-loader-letter" style="animation-delay:0.42s">k</span><span class="brand-loader-letter" style="animation-delay:0.48s">e</span>
        </div>
        <div class="brand-loader-sub">OLONGAPO CITY TRANSIT</div>
        <div class="brand-loader-bar"><div class="brand-loader-bar-fill"></div></div>
        <div class="brand-loader-msg">Loading your ride...</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
