<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fairtrike Olongapo | Commuter Transit Portal</title>
    <meta name="description" content="Olongapo City tricycle transit hailing and regulated fare matrix." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#004328" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fairtrike" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <style>
      /* Inline boot splash so the logo+name paint instantly on refresh, before the bundle loads */
      #boot-splash { position: fixed; inset: 0; z-index: 9999; display: flex; justify-content: center; align-items: center;
        background: radial-gradient(600px 300px at 50% 18%, rgba(13,92,58,.16), transparent 70%),
                    radial-gradient(500px 260px at 50% 85%, rgba(0,108,73,.10), transparent 70%), #faf8ff;
        transition: opacity .4s ease; }
      #boot-splash.boot-hidden { opacity: 0; pointer-events: none; }
      #boot-splash .brand-loader-inner { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 24px; }
      #boot-splash .brand-mark { position: relative; display: flex; align-items: center; justify-content: center; border-radius: 22px;
        background: #0d5c3a; color: #ffffff; font-weight: 800; font-family: 'Plus Jakarta Sans',sans-serif;
        box-shadow: 0 12px 32px rgba(13,92,58,.45), inset 0 1px 0 rgba(255,255,255,.5); animation: brandBounce 1.6s ease-in-out infinite; }
      #boot-splash .brand-mark-ft { font-size: 30px; letter-spacing: -.02em; line-height: 1; }
      #boot-splash .brand-mark-check { position: absolute; top: -8px; right: -8px; width: 26px; height: 26px; border-radius: 50%;
        background: #006c49; color: #fff; display: flex; align-items: center; justify-content: center;
        border: 3px solid #faf8ff; font-size: 14px; font-weight: 700; animation: brandPop 1.6s ease-in-out infinite; }
      #boot-splash .brand-loader-name { margin-top: 18px; font-size: 40px; font-weight: 800; letter-spacing: -.02em; color: #131b2e; font-family: 'Plus Jakarta Sans',sans-serif; }
      #boot-splash .brand-loader-letter { display: inline-block; animation: brandLetterWave 1.4s ease-in-out infinite; }
      #boot-splash .brand-loader-sub { margin-top: 4px; font-size: 11px; font-weight: 700; letter-spacing: .22em; color: #004328; font-family: 'Plus Jakarta Sans',sans-serif; }
      #boot-splash .brand-loader-bar { margin-top: 20px; width: 210px; height: 6px; border-radius: 9999px; background: #dae2fd; overflow: hidden; }
      #boot-splash .brand-loader-bar-fill { height: 100%; width: 40%; border-radius: 9999px; background: #0d5c3a; animation: brandBarSlide 1.1s ease-in-out infinite; }
      #boot-splash .brand-loader-msg { margin-top: 12px; font-size: 13px; color: #006c49; font-family: 'Plus Jakarta Sans',sans-serif; animation: brandMsgPulse 1.4s ease-in-out infinite; }
      @keyframes brandBounce { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.04); } }
      @keyframes brandPop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
      @keyframes brandLetterWave { 0%,100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(-6px); opacity: .75; } }
      @keyframes brandBarSlide { 0% { transform: translateX(-110%); } 100% { transform: translateX(280%); } }
      @keyframes brandMsgPulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="brand-loader-inner">
        <div class="brand-mark" style="width:76px;height:76px">
          <span class="brand-mark-ft">FT</span>
          <span class="brand-mark-check">&#10003;</span>
          <span class="brand-mark-ring"></span>
        </div>
        <div class="brand-loader-name">
          <span class="brand-loader-letter" style="animation-delay:0s">F</span><span class="brand-loader-letter" style="animation-delay:0.06s">a</span><span class="brand-loader-letter" style="animation-delay:0.12s">i</span><span class="brand-loader-letter" style="animation-delay:0.18s">r</span><span class="brand-loader-letter" style="animation-delay:0.24s">t</span><span class="brand-loader-letter" style="animation-delay:0.3s">r</span><span class="brand-loader-letter" style="animation-delay:0.36s">i</span><span class="brand-loader-letter" style="animation-delay:0.42s">k</span><span class="brand-loader-letter" style="animation-delay:0.48s">e</span>
        </div>
        <div class="brand-loader-sub">OLONGAPO CITY TRANSIT</div>
        <div class="brand-loader-bar"><div class="brand-loader-bar-fill"></div></div>
        <div class="brand-loader-msg">Loading your ride...</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
